schema_version: 1

context:
  name: hipfft
  version: "7.2.4"

recipe:
  name: hipfft-split
  version: ${{ version }}

source:
  url: https://github.com/ROCm/rocm-libraries/releases/download/rocm-${{ version }}/hipfft.tar.gz
  sha256: 65d08232b0f83dda214c96e869db4b68380a12a7f6526ae008ec5faf19ec30e9

build:
  number: 0
  skip:
    - not linux
    - hip_compiler_version in (None, "None")

outputs:
  - staging:
      name: hipfft-build
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('hip') }}
        - cmake
        - pkgconf
        - ninja
      host:
        - rocm-core ${{ version }}.*
        - rocm-cmake
        - librocfft-devel
    build:
      script: build.sh

  - package:
      name: libhipfft
    inherit: hipfft-build
    build:
      files:
        include:
          - "**/*"
        exclude:
          - include/**
          - lib/*.a
          - lib/cmake/**
          - lib/pkgconfig/**
          - share/pkgconfig/**
          - share/doc/**
    tests:
      - package_contents:
          lib:
            - hipfft
            - hipfftw

  - package:
      name: libhipfft-devel
    inherit: hipfft-build
    build:
      files:
        - include/**
        - lib/*.a
        - lib/cmake/**
        - lib/pkgconfig/**
        - share/pkgconfig/**
        - share/doc/**
    requirements:
      run:
        - hip-devel
        - librocfft-devel
        - ${{ pin_subpackage('libhipfft', exact=True) }}
      run_exports:
        - ${{ pin_subpackage('libhipfft', upper_bound='x.x') }}
    tests:
      - requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
        script:
          - cmake-package-check hipfft
      - package_contents:
          include:
            - hipfft/hipfft.h

  - package:
      name: hipfft
    requirements:
      run:
        - ${{ pin_subpackage('libhipfft-devel', exact=True) }}
    tests:
      - script:
          - test -f $PREFIX/include/hipfft/hipfft.h

about:
  homepage: https://rocm.docs.amd.com/projects/hipFFT
  summary: hipFFT is an FFT marshalling library.
  description: |
    hipFFT is an FFT marshalling library that exports a common interface
    for GPU FFT backends. On AMD GPUs it uses rocFFT as its backend.
  license: MIT
  license_file: LICENSE.md
  documentation: https://rocm.docs.amd.com/projects/hipFFT/en/latest/
  repository: https://github.com/ROCm/rocm-libraries/tree/develop/projects/hipfft

extra:
  feedstock-name: hipfft
  recipe-maintainers:
    - zklaus
    - conda-forge/rocm-core
